<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Operator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="Browser Operator" class="logo-img">
        <div>
          <h3>Browser Operator</h3>
          <p class="subtitle">Live Chrome Bridge</p>
        </div>
      </div>
      <div id="statusBadge" class="badge disconnected">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-section">
      <div class="info-row">
        <span class="label">Bridge:</span>
        <span class="val">127.0.0.1:8765</span>
      </div>
      <div class="info-row">
        <span class="label">Status:</span>
        <span id="agentStatus" class="val">Waiting for Bridge...</span>
      </div>
      <div class="info-row">
        <span class="label">Profile:</span>
        <span id="activeProfileName" class="val truncate">Detecting...</span>
      </div>
      <div class="info-row">
        <span class="label">Active Tab:</span>
        <span id="activeTabTitle" class="val truncate">Loading...</span>
      </div>
    </div>

    <!-- Security & Authentication -->
    <div class="security-section">
      <div class="section-title-row">
        <span class="section-title">🔐 Security Token</span>
        <span id="authStatusBadge" class="auth-pill unverified">Not Configured</span>
      </div>
      <div class="token-input-group">
        <input type="password" id="tokenInput" placeholder="Paste token here..." autocomplete="off" spellcheck="false">
        <button id="toggleTokenBtn" class="icon-btn" title="Show/Hide Token" type="button">👁️</button>
      </div>
      <div class="token-cmd-box" id="copyCmdBox" title="Click to copy PowerShell command">
        <code id="tokenCmdText">Get-Content "$HOME\.browser-operator\token" | Set-Clipboard</code>
        <button id="copyCmdBtn" class="copy-cmd-btn" type="button" title="Copy Command">📋</button>
      </div>
      <div class="token-actions">
        <button id="saveTokenBtn" class="btn secondary">Save Token</button>
        <button id="reconnectBtn" class="btn primary">Reconnect</button>
      </div>
    </div>

    <div class="footer">
      <button id="reloadExtBtn" class="link-btn" title="Restart Extension Service Worker">🔄 Reload Extension</button>
      <div class="footer-caption">Protected by Cryptographic Token & CSWSH Filter</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
